name: One-off licence audit
on:
  push:
    branches: [docs/mit-license]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install production dependencies without lifecycle scripts
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Collect exact upstream licence evidence
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'
          import crypto from 'node:crypto'
          const root = process.cwd()
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          const out = path.join(root, 'license-audit')
          fs.mkdirSync(out, { recursive: true })
          const records = []
          const unresolved = []
          const omitted = []
          const sections = ['# Third-party licence evidence', '', 'Generated from the installed production npm dependency tree. This is evidence for review, not an approved release notice.', '']
          const seen = new Set()
          for (const [lockPath, entry] of Object.entries(lock.packages)) {
            if (!lockPath.includes('node_modules/') || entry.dev || entry.link) continue
            const dir = path.join(root, lockPath)
            const manifest = path.join(dir, 'package.json')
            if (!fs.existsSync(manifest)) {
              omitted.push({ path: lockPath, version: entry.version, optional: !!entry.optional })
              if (!entry.optional) unresolved.push(`${lockPath}: required package not installed`)
              continue
            }
            const pkg = JSON.parse(fs.readFileSync(manifest, 'utf8'))
            const key = `${pkg.name}@${pkg.version}`
            if (seen.has(key)) continue
            seen.add(key)
            const license = typeof pkg.license === 'string' ? pkg.license : (typeof entry.license === 'string' ? entry.license : 'UNKNOWN')
            const files = fs.readdirSync(dir).filter(name => /^(?:LICEN[CS]E|COPYING|COPYRIGHT|NOTICE|THIRD[_-]PARTY[_-]NOTICES?)(?:$|[._-])/i.test(name) && fs.statSync(path.join(dir, name)).isFile()).sort()
            const record = { name: pkg.name, version: pkg.version, license, files: [], repository: pkg.repository || null }
            sections.push(`## ${key}`, '', `Declared licence: ${license}`, '')
            if (!files.length || /UNKNOWN|UNLICENSED|\*/i.test(license)) unresolved.push(`${key}: missing/unclear licence evidence`)
            for (const file of files) {
              const text = fs.readFileSync(path.join(dir, file), 'utf8')
              record.files.push({ name: file, sha256: crypto.createHash('sha256').update(text).digest('hex') })
              sections.push(`### ${file}`, '', '```text', text.replace(/```/g, '` ` `'), '```', '')
              const dest = path.join(out, 'upstream', key)
              fs.mkdirSync(dest, { recursive: true })
              fs.writeFileSync(path.join(dest, file), text)
            }
            if (!files.length) {
              const readme = fs.readdirSync(dir).find(name => /^README(?:$|\.)/i.test(name))
              if (readme) sections.push('### README (for manual licence review)', '', '```text', fs.readFileSync(path.join(dir, readme), 'utf8').replace(/```/g, '` ` `'), '```', '')
            }
            records.push(record)
          }
          records.sort((a,b) => `${a.name}@${a.version}`.localeCompare(`${b.name}@${b.version}`))
          for (const expected of ['react', 'express', 'bcryptjs', 'dompurify', 'jszip']) {
            if (!records.some(r => r.name === expected)) throw new Error(`Missing runtime dependency: ${expected}`)
          }
          if (records.length < 100) throw new Error(`Incomplete dependency inventory: ${records.length} packages`)
          fs.writeFileSync(path.join(out, 'packages.json'), JSON.stringify(records, null, 2) + '\n')
          fs.writeFileSync(path.join(out, 'omitted.json'), JSON.stringify(omitted, null, 2) + '\n')
          fs.writeFileSync(path.join(out, 'unresolved.txt'), unresolved.join('\n') + '\n')
          fs.writeFileSync(path.join(out, 'THIRD_PARTY_NOTICES.md'), sections.join('\n'))
          console.log(`Inventoried ${records.length} unique production packages; ${unresolved.length} unresolved; ${omitted.length} platform-omitted packages.`)
          if (unresolved.length) console.log('Manual review required:\n' + unresolved.join('\n'))
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: licence-audit
          path: license-audit/
          if-no-files-found: error
