name: Finalise source licence
on:
  push:
    branches: [docs/mit-license]
permissions:
  contents: write
jobs:
  finalise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply licensing metadata only
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import assert from 'node:assert/strict'
          const read = p => fs.readFileSync(p, 'utf8')
          const write = (p, s) => fs.writeFileSync(p, s)
          const paths = ['package.json', 'client/package.json', 'server/package.json', 'e2e/package.json']
          for (const file of paths) {
            const before = JSON.parse(read(file))
            const after = structuredClone(before)
            after.license = 'MIT'
            const without = x => { const y = structuredClone(x); delete y.license; return y }
            assert.deepEqual(without(after), without(before))
            write(file, JSON.stringify(after, null, 2) + '\n')
          }
          const lock = JSON.parse(read('package-lock.json'))
          for (const key of ['', 'client', 'server', 'e2e']) {
            assert.ok(lock.packages[key], `Missing lockfile workspace: ${key}`)
            lock.packages[key].license = 'MIT'
          }
          write('package-lock.json', JSON.stringify(lock, null, 2) + '\n')
          let readme = read('README.md')
          const old = 'Monrad Estimator is open source software licensed under the [MIT License](LICENSE).'
          assert.ok(readme.includes(old), 'Expected README licence section not found')
          readme = readme.replace(old, old + '\n\nThird-party dependencies retain their own licences. See [Third-party software and notices](THIRD_PARTY_NOTICES.md) for attribution and redistribution guidance.')
          readme = readme.replace('upsert-by-hierarchy re-import, unique template names', 'upsert-by-hierarchy import, unique template names')
          write('README.md', readme)
          fs.unlinkSync('.github/workflows/license-audit.yml')
          NODE
          git diff --check
          git add package.json client/package.json server/package.json e2e/package.json package-lock.json README.md .github/workflows/license-audit.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: align MIT metadata and link third-party notices'
          git push origin HEAD:docs/mit-license
