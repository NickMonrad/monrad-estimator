name: E2E Tests

on:
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: monrad_estimator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/monrad_estimator
      JWT_SECRET: ci-test-secret-for-github-actions-32chars
      NODE_ENV: test
      PORT: 3001
      CLIENT_URL: http://localhost:5173
      TEST_EMAIL: test@example.com
      TEST_PASSWORD: password123

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      # ── Audit dependencies ───────────────────────────────────────
      - name: Audit dependencies
        run: |
          cd server && npm audit --audit-level=high
          cd ../client && npm audit --audit-level=high
        continue-on-error: true

      # ── Install all workspace dependencies at once ──────────────
      - name: Install all dependencies
        run: npm ci

      # ── Backup regression tests (deterministic, no Docker/DB needed) ──
      - name: Backup regression tests
        run: npm run test:backup

      # ── PDF generation smoke test (real Chromium) ────────────────
      - name: PDF generation smoke test
        run: npm run test:pdf-smoke

      # ── Client clone commercial parity test ──────────────────────
      - name: Client clone commercial parity test
        working-directory: client
        run: npx vitest run src/test/clone-commercial-parity.test.ts

      # ── Client snapshot regression tests ─────────────────────────
      - name: Client snapshot regression tests
        working-directory: client
        run: npx vitest run src/test/canonical-commercial-consistency.test.ts src/test/resource-profile-export.test.ts

      # ── Validate local E2E runner ─────────────────────────────────
      - name: Validate local E2E runner loads env correctly
        run: node scripts/run-e2e-local.mjs --validate

      # ── TypeScript type-checking ──────────────────────────────────
      - name: TypeScript check (client)
        working-directory: client
        run: npm run typecheck

      - name: TypeScript check (server)
        working-directory: server
        run: npm run typecheck

      # ── ESLint ──────────────────────────────────────────────────
      - name: Lint (client)
        working-directory: client
        run: npm run lint

      - name: Lint (server)
        working-directory: server
        run: npm run lint

      # ── Unit and integration tests ───────────────────────────────
      - name: Server unit and integration tests
        working-directory: server
        run: npm test

      - name: Client unit tests
        working-directory: client
        run: npm test

      # ── Server ──────────────────────────────────────────────────
      - name: Run database migrations
        working-directory: server
        run: npx prisma migrate deploy

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      # ── Snapshot rollback integration tests (real PostgreSQL) ──
      - name: Snapshot rollback integration tests
        working-directory: server
        run: npm run test:snapshot-integration


      # ── Clone integration tests (real PostgreSQL) ─────────────
      - name: Clone integration tests
        working-directory: server
        run: npm run test:clone-integration
      - name: Seed database (creates E2E test user)
        working-directory: server
        run: npx tsx prisma/seed.ts

      - name: Verify seed user exists
        run: |
          PGPASSWORD=postgres psql -U postgres -h localhost -d monrad_estimator \
            -c 'SELECT email, length(password) as pwd_len FROM "User" WHERE email = $$test@example.com$$;'

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Start API server
        working-directory: server
        run: node dist/index.js &

      # ── Client ──────────────────────────────────────────────────
      - name: Build client
        working-directory: client
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3001

      - name: Serve client build
        working-directory: client
        run: npx vite preview --port 5173 --host &

      # ── Wait for servers ─────────────────────────────────────────
      - name: Wait for API and client to be ready
        run: npx --yes wait-on http://localhost:3001/health http://localhost:5173 --timeout 30000

      - name: Smoke test API login
        run: |
          echo "Health check:"
          curl -s http://localhost:3001/health
          echo ""
          echo "Login response:"
          curl -s -w "\nHTTP %{http_code}" -X POST http://localhost:3001/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"test@example.com","password":"password123"}'

      # ── Playwright ───────────────────────────────────────────────
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test --grep-invert @screenshots
        env:
          BASE_URL: http://localhost:5173

      # ── Artifacts ────────────────────────────────────────────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.sha }}
          path: e2e/playwright-report/
          retention-days: 14
  backup-windows:
    name: Backup regression (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
      - name: Install dependencies (no scripts)
        run: npm ci --ignore-scripts

      - name: Verify native optional package versions
        shell: pwsh
        run: |
          # Check that declared optional packages resolve correctly
          $packages = @(
            '@rolldown/binding-win32-x64-msvc',
            '@tailwindcss/oxide-win32-x64-msvc',
            'lightningcss-win32-x64-msvc'
          )
          $failed = $false
          foreach ($pkg in $packages) {
            try { $ver = node -e "console.log(require('$pkg/package.json').version)" 2>$null } catch { $ver = '' }
            if ([string]::IsNullOrEmpty($ver)) {
              Write-Host "::error::Windows native package $pkg not resolved"
              $failed = $true
            } else {
              Write-Host "✅ $pkg version $ver"
            }
          }
          # Verify esbuild resolves to a compatible version
          $esbuildVer = node -e "console.log(require('esbuild/package.json').version)" 2>$null
          if (-not [string]::IsNullOrEmpty($esbuildVer)) {
            Write-Host "✅ esbuild version $esbuildVer"
          }
          if ($failed) { exit 1 }
      - name: Backup regression tests
        run: npm run test:backup
