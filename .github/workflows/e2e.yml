name: E2E Tests

on:
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: ci-test-secret-for-github-actions-32chars
      NODE_ENV: test


    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      # ── Audit dependencies ───────────────────────────────────────
      - name: Audit dependencies
        run: |
          cd server && npm audit --audit-level=high
          cd ../client && npm audit --audit-level=high
        continue-on-error: true

      # ── Install all workspace dependencies at once ──────────────
      - name: Install all dependencies
        run: npm ci

      # ── Backup regression tests (deterministic, no Docker/DB needed) ──
      - name: Backup regression tests
        run: npm run test:backup

      # ── Chrome installer lifecycle tests ────────────────────────────
      - name: Chrome installer lifecycle tests
        run: npm run test:install-chrome

      # ── PDF browser cleanup tests ────────────────────────────────────
      - name: PDF browser cleanup tests
        run: npm run test:pdf-cleanup

      # ── PDF generation smoke test (real Chromium) ────────────────
      - name: PDF generation smoke test
        run: npm run test:pdf-smoke

      # ── Client clone commercial parity test ──────────────────────
      - name: Client clone commercial parity test
        working-directory: client
        run: npx vitest run src/test/clone-commercial-parity.test.ts

      # ── Client snapshot regression tests ─────────────────────────
      - name: Client snapshot regression tests
        working-directory: client
        run: npx vitest run src/test/canonical-commercial-consistency.test.ts src/test/resource-profile-export.test.ts

      # ── Validate local E2E runner ─────────────────────────────────
      - name: Validate local E2E runner loads env correctly
        run: node scripts/run-e2e-local.mjs --validate

      # ── TypeScript type-checking ──────────────────────────────────
      - name: TypeScript check (client)
        working-directory: client
        run: npm run typecheck

      - name: TypeScript check (server)
        working-directory: server
        run: npm run typecheck

      # ── ESLint ──────────────────────────────────────────────────
      - name: Lint (client)
        working-directory: client
        run: npm run lint

      - name: Lint (server)
        working-directory: server
        run: npm run lint

      # ── Unit and integration tests ───────────────────────────────
      - name: Server unit and integration tests
        working-directory: server
        run: npm test

      - name: Client unit tests
        working-directory: client
        run: npm test

      # ── Build (independent validation) ──────────────────────────
      - name: Build server
        working-directory: server
        run: npm run build

      - name: Build client
        working-directory: client
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3001

      # ── Docker-first E2E lifecycle ────────────────────────────────
      # ubuntu-latest already supplies Chromium's runtime libraries. Avoid
      # Playwright's --with-deps apt phase, whose Azure mirror can hang.
      - name: Install Playwright Chromium
        timeout-minutes: 10
        working-directory: e2e
        run: npx playwright install chromium

      - name: Run Docker-first E2E lifecycle
        run: npm run test:e2e:local

      # ── Artifacts ────────────────────────────────────────────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.sha }}
          path: e2e/playwright-report/
          retention-days: 14

      # ── Cleanup diagnostics ─────────────────────────────────────────
      - name: Check for leftover Docker containers
        if: always()
        run: |
          containers=$(docker ps -a --filter name=monrad_pg_ --format '{{.ID}} {{.Names}} {{.CreatedAt}}' 2>/dev/null || true)
          if [ -n "$containers" ]; then
            echo "::warning::Found monrad_pg_ containers that may be leftover from this run:"
            echo "$containers"
            exit 1
          else
            echo "No monrad_pg_ containers remain — cleanup successful"
          fi
  lifecycle:
    name: Lifecycle ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run deterministic lifecycle tests
        run: npm run test:local-db

  docker-integration:
    name: Docker-first integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Docker-first integration tests
        run: npm run test:integration:local
  backup-windows:
    name: Backup regression (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify Windows native optional packages
        shell: pwsh
        run: |
          $expected = @{
            '@esbuild/win32-x64' = '0.28.1'
            '@rolldown/binding-win32-x64-msvc' = '1.1.5'
            '@tailwindcss/oxide-win32-x64-msvc' = '4.3.2'
            'lightningcss-win32-x64-msvc' = '1.32.0'
          }

          $failed = $false

          foreach ($pkg in $expected.Keys) {
            $expectedVersion = $expected[$pkg]

            try {
              $actualVersion = node -e "console.log(require('$pkg/package.json').version)"
            } catch {
              $actualVersion = ''
            }

            if ([string]::IsNullOrWhiteSpace($actualVersion)) {
              Write-Host "::error::Could not resolve $pkg"
              $failed = $true
              continue
            }

            $actualVersion = $actualVersion.Trim()

            if ($actualVersion -ne $expectedVersion) {
              Write-Host "::error::$pkg resolved to $actualVersion; expected $expectedVersion"
              $failed = $true
            } else {
              Write-Host "Verified $pkg@$actualVersion"
            }
          }

          if ($failed) {
            exit 1
          }

      - name: Backup regression tests
        run: npm run test:backup
